# IGO Nursery - nginx config for the built Vite single-page app (port 3000).
# Sits behind Dokploy/Traefik, which handles HTTPS and the http -> https redirect.

# Real site pages. Anything else (that is not a file) gets a genuine 404 status,
# while still showing the app's own "page not found" screen.
map $uri $spa_route {
  default 0;
  ~^/$ 1;
  ~^/(login|admin|plants|seeds|pots-planters|plant-care|category|search|plant-finder|product|gifting|corporate-gifts|cart|checkout|account|wishlist|offers|just-in|garden-services|landscaping|blog|locate-store|about|gallery|contact|shipping-policy|privacy-policy|terms)(/.*)?$ 1;
}

# Keep private pages out of search results (also set in the page's robots meta tag).
map $request_uri $robots_tag {
  default "";
  ~^/(admin|cart|checkout|account|login|wishlist|search)(/|\?|$) "noindex, nofollow";
}

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml application/xml+rss image/svg+xml;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Robots-Tag $robots_tag always;

  # Never expose hidden files (.env, .git, ...)
  location ~ /\.(?!well-known) {
    return 404;
  }

  # Fingerprinted build files: cache for a year
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Images, video and fonts: cache for 30 days
  location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|mp4|webm|woff2?|ttf)$ {
    expires 30d;
    try_files $uri =404;
  }

  # SEO files: short cache so updates show up quickly
  location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
    expires 1h;
    try_files $uri =404;
  }

  # The app shell must always be fresh
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri @app;
  }

  location @app {
    if ($spa_route = 0) {
      return 404;
    }
    rewrite ^ /index.html break;
    expires -1;
  }

  # Unknown URLs: real 404 status, app's not-found page as the body
  error_page 404 /index.html;
}
